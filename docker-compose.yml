services:
  what-to-eat:
    image: fxanhkhoa/what-to-eat:latest
    container_name: what-to-eat
    restart: always
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.what-to-eat.rule=Host(`eatwhat.io.vn`) || Host(`www.eatwhat.io.vn`)"
      - "traefik.http.routers.what-to-eat.entrypoints=websecure"
      - "traefik.http.routers.what-to-eat.tls=true"
      - "traefik.http.services.what-to-eat.loadbalancer.server.port=4000"

networks:
  traefik-public:
    external: true

